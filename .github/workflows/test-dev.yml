name: tests-dev

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test-mixed:
    name: node test_mixed.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression suite
        run: npm test
